spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adm_financiera}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:102938}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.docker.compose.enabled=false

# Orígenes del frontend (separados por coma). En producción: https://tu-app.vercel.app
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# Correo (SMTP). Sin SPRING_MAIL_HOST el enlace de recuperación solo aparece en los logs del backend.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
app.mail.from=${APP_MAIL_FROM:${spring.mail.username:}}

# Tiempo de vida del token JWT: 15 minutos
jwt.expiration-ms=900000
jwt.secret=${JWT_SECRET:MiSecretoJWTMuySeguro1234567890}